apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 30s
      scrape_timeout: 10s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # node-exporter - DaemonSet: один под на каждую ноду.
      # kubernetes_sd_configs с role: endpoints - рекомендуемый способ
      # скрейпить каждый под DaemonSet'а отдельно. static_configs с одним
      # DNS-именем Service'а даёт метрики только ОДНОЙ случайной ноды.
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['monitoring']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node

      - job_name: 'cadvisor'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['monitoring']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: cadvisor
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']

      - job_name: 'alertmanager'
        static_configs:
          - targets: ['alertmanager.monitoring.svc.cluster.local:9093']

      # ДОБАВЛЕНО: МОНИТОРИНГ СИСТЕМНЫХ КОМПОНЕНТОВ KUBERNETES
      # API Server (Control Plane)
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true # Игнорируем самоподписанные сертификаты локального кластера
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          # Выбираем только стандартный сервис kubernetes в namespace default на https порту (443)
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # CoreDNS (Внутренний DNS)
      - job_name: 'coredns'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['kube-system'] # CoreDNS живет в системном неймспейсе
        relabel_configs:
          # Ищем сервис kube-dns
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: kube-dns
          # Собираем метрики только с порта metrics (9153)
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics

    alerting:
      alertmanagers:
        # Используется discovery через endpoints, чтобы конфигурация
        # не требовала изменений при будущем масштабировании
        # Alertmanager до нескольких реплик.
        # При текущем replicas: 1 аналогично работал бы и обычный
        # static_configs с ClusterIP Service.
        - kubernetes_sd_configs:
            - role: endpoints
              namespaces:
                names: ['monitoring']
          relabel_configs:
            # Фильтр по имени сервиса - берём только headless (он содержит
            # endpoint'ы всех трёх подов), а не обычный ClusterIP.
            - source_labels: [__meta_kubernetes_service_name]
              action: keep
              regex: alertmanager-headless
            # Фильтр по имени порта - берём только http (9093), не cluster
            # (9094, который нужен только для gossip между репликами).
            - source_labels: [__meta_kubernetes_endpoint_port_name]
              action: keep
              regex: http
          timeout: 30s

    rule_files:
      - "/etc/prometheus/alerts/host.yml"
      - "/etc/prometheus/alerts/container.yml"
      - "/etc/prometheus/alerts/service.yml"
      - "/etc/prometheus/alerts/kubernetes.yml"
