apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:10.2.2
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: grafana_admin_user

            - name: GF_SECURITY_ADMIN_PASSWORD_FILE
              value: /run/secrets/grafana_admin_password

            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"

            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"

            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"

            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning

            - name: GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS
              value: ""

            - name: GF_PLUGIN_SKIP_PUBLIC_KEY_DOWNLOAD
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - name: grafana-secrets
              mountPath: /run/secrets/grafana_admin_password
              subPath: grafana_admin_password
              readOnly: true
            - name: configmap-provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: configmap-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboard.yml
              subPath: dashboard.yml
            # Монтируем через projected volume - оба ConfigMap объединяются в
            # одну директорию без subPath, что критично для работы
            # updateIntervalSeconds: 30 (Grafana перечитывает файлы сама,
            # kubelet обновляет их автоматически каждые ~60 сек, так как
            # тут нет subPath).
            - name: dashboards
              mountPath: /etc/grafana/dashboards/
            # Эфемерное хранилище: stateless по решению из другого чата.
            # SQLite и пользовательские настройки UI теряются при рестарте -
            # принятый трейдофф: всё важное (дашборды, datasource, пользователь)
            # приходит из ConfigMap/Secret при старте.
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: grafana-logs
              mountPath: /var/log/grafana
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: grafana-secrets
          secret:
            name: grafana-secret
        - name: configmap-provisioning
          configMap:
            name: grafana-provisioning
        # ИЗМЕНЕНО: был один ConfigMap "grafana-dashboards" с обоими JSON (~565KB).
        # Разбит на два отдельных ConfigMap (по одному дашборду в каждом),
        # чтобы не упереться в лимит 1 MiB при добавлении третьего дашборда.
        # projected volume объединяет оба ConfigMap в одну директорию -
        # Grafana видит оба JSON в /etc/grafana/dashboards/, как если бы
        # они лежали в одном ConfigMap.
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-cadvisor
              - configMap:
                  name: grafana-dashboard-node-exporter
        - name: grafana-storage
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: grafana-logs
          emptyDir: {}
