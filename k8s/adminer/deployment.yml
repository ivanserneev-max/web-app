apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: monitoring
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: adminer
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/version: "4.8.1"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: monitoring
      app.kubernetes.io/name: adminer
      app.kubernetes.io/part-of: monitoring
  template:
    metadata:
      labels:
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/name: adminer
        app.kubernetes.io/part-of: monitoring
        app.kubernetes.io/version: "4.8.1"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          securityContext:
            runAsUser: 999
            runAsNonRoot: true
          command:
            - sh
            - -c
            - "until pg_isready -h postgres -p 5432 -U appuser; do echo waiting for postgres; sleep 2; done"
        - name: copy-adminer-files
          image: adminer:4.8.1
          securityContext:
            runAsUser: 999
            runAsNonRoot: true
          command:
            - sh
            - -c
            - "cp -r /var/www/html/. /html-data/"
          volumeMounts:
            - name: var
              mountPath: /html-data 
      containers:
        - name: adminer
          image: adminer:4.8.1
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: "postgres" # DNS-имя Service Postgres
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          securityContext:
            runAsUser: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: var
              mountPath: /var/www/html
            - name: php-sessions
              mountPath: /var/lib/php/sessions
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: var
          emptyDir: {}
        - name: php-sessions
          emptyDir: {}
