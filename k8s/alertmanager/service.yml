# headless - стабильное DNS-имя для StatefulSet (требование serviceName).
# обычный ClusterIP - для Prometheus (alerting.alertmanagers в
# prometheus/configmap.yml) и для ручного доступа к UI Alertmanager изнутри
# кластера (silence'ы, просмотр текущих алертов).
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-headless
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
      protocol: TCP
