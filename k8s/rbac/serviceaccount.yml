# ServiceAccount, от имени которого Prometheus обращается к Kubernetes API
# (kubernetes_sd_configs в prometheus/configmap.yml использует его токен
# для аутентификации при service discovery подов/эндпоинтов/нод).
#
# ДОБАВЛЕНО: automountServiceAccountToken: true явно (M3 из замечаний).
# У kube-state-metrics/serviceaccount.yml это поле уже было явным,
# у prometheus отсутствовало - несоответствие стиля.
# Выставление true явно убирает двусмысленность: читающий видит осознанный
# выбор "токен нужен", а не "просто не поставили false".
automountServiceAccountToken: true
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
