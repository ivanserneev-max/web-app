apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      # Если Alertmanager перестаёт получать алерт от Prometheus (например,
      # сам Prometheus недоступен), он подождёт 5 минут перед тем, как
      # считать алерт автоматически "resolved" - защита от случайного
      # "всё ок" из-за временного сетевого сбоя, а не реального решения.
      resolve_timeout: 5m

    route:
      receiver: discord-and-ntfy
      # ИСПРАВЛЕНО: убран "name" - этот label не выставляется ни одним
      # правилом ни в одном из 4 файлов prometheus/configmap-alerts.yml
      # (там используются только alertname/severity/component). Это было
      # наследие старого Docker Compose сетапа, где "name" добавлялся через
      # relabeling на cAdvisor (имя контейнера). В K8s такого relabeling
      # нет - group_by с несуществующим label просто не делает ничего
      group_by:
        - alertname
        - severity
        - component
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - component = "monitoring"
          group_wait: 0s
          repeat_interval: 30m

        - matchers:
            - severity = "critical"
          group_wait: 1s
          repeat_interval: 1h

    receivers:
      # Основной рабочий receiver: Discord + ntfy
      # (Telegram сейчас заблокирован провайдером, см. ниже)
      - name: 'discord-and-ntfy'
        discord_configs:
          - webhook_url_file: /run/secrets/discord_webhook
            title: '{{ if eq .Status "firing" }}🔥 {{ .GroupLabels.alertname }}{{ else }}✅ {{ .GroupLabels.alertname }} (resolved){{ end }}'
            message: |
              **Severity:** {{ .CommonLabels.severity }}
              **Component:** {{ .CommonLabels.component }}
              **Namespace:** {{ .CommonLabels.namespace }}
              {{ range .Alerts }}
              • {{ if .Labels.pod }}{{ .Labels.pod }}{{ else }}{{ .Labels.instance }}{{ end }} — {{ .Annotations.description }}
              {{ end }}
            send_resolved: true

        webhook_configs:
          - url_file: /run/secrets/ntfy_url
            # Таймаут ОБЯЗАТЕЛЕН: без него зависший запрос к
            # внешнему сервису может висеть неограниченно.
            # Должен быть < group_interval (5m).
            timeout: 10s
            send_resolved: true
            max_alerts: 0
            
      # Telegram — определён, но НЕ подключён ни в одном route
      # Это ОФИЦИАЛЬНО поддерживаемая конфигурация Alertmanager
      # (receiver без route). Когда Telegram станет доступен,
      # чтобы включить: добавьте 'receiver: telegram' в нужный
      # route (или в default) — БОЛЬШЕ НИЧЕГО МЕНЯТЬ НЕ НУЖНО.
      - name: 'telegram'
        telegram_configs:
          - bot_token_file: '/run/secrets/telegram_token'
            chat_id_file:   '/run/secrets/telegram_chat_id'
            message: |
              {{ if eq .Status "firing" }}🔥 АЛЕРТ{{ else }}✅ РЕШЕНО{{ end }}

              Алерт: {{ .GroupLabels.alertname }}
              Срочность: {{ .CommonLabels.severity }}
              Компонент: {{ .CommonLabels.component }}
              Namespace: {{ .CommonLabels.namespace }}

              {{ range .Alerts }}
              📦 {{ if .Labels.pod }}{{ .Labels.pod }}{{ else }}{{ .Labels.instance }}{{ end }}
              {{ if .Labels.instance }}🖥 Хост: {{ .Labels.instance }}{{ end }}
              📝 {{ .Annotations.description }}
              ⏰ Начало: {{ .StartsAt.Local.Format "02.01.2006 15:04:05" }}
              {{ end }}
            parse_mode: ""        # Пусто = без Markdown, чтобы спецсимволы не ломали
            send_resolved: true

    inhibit_rules:
      # Если упал сам экспортер (cAdvisor/node-exporter), не нужно
      # одновременно заваливать Telegram алертами по всем метрикам, которые
      # от него зависят, - это просимптом того же сбоя, а не отдельная
      # проблема. equal: [] здесь намеренно пустой: подавляюися все алерты
      # нужного component, пока источник активен, без привязки к
      # совпадению дополнительных labels.
      - source_matchers:
          - alertname = "CAdvisorDown"
        target_matchers:
          - component = "container"
        equal: []

      - source_matchers:
          - alertname = "NodeExporterDown"
        target_matchers:
          - component = "host"
        equal: []

      # Если по одному и тому же alertname/component уже горит critical -
      # подавляем дублирующий warning по тому же поводу. ИСПРАВЛЕНО: "name"
      # убран по той же причине, что и в group_by выше (label не существует
      # ни в одном правиле - без него условие "equal" работает так же, но
      # не вводит в заблуждение при чтении).
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['alertname', 'component', 'namespace']
