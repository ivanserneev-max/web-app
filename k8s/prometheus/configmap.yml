apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s 
      evaluation_interval: 30s 
      scrape_timeout: 10s 
    scrape_configs:
    - job_name: prometheus # Метрики самого Prometheus
      static_configs:
      - targets: ['localhost:9090']

    - job_name: node-exporter # Метрики хоста (CPU, RAM, Disk, Network)
      static_configs:
        - targets: ['node-exporter.monitoring.svc.cluster.local:9100']

    - job_name: cadvisor # Метрики Docker-контейнеров
      static_configs:
        - targets: ['cadvisor.monitoring.svc.cluster.local:8080']

    - job_name: alertmanager # Метрики Alertmanager (Позволяет алертить если Alertmanager сам упал)
      static_configs:
        - targets: ['alertmanager.monitoring.svc.cluster.local:9093']

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.monitoring.svc.cluster.local:9093']
          timeout: 30s

    rule_files:
      - "/etc/prometheus/alerts/host.yml"
      - "/etc/prometheus/alerts/container.yml"
      - "/etc/prometheus/alerts/service.yml"
